name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Linux TA-Lib prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libta-lib0 libta-lib-dev

      - name: Install macOS TA-Lib prerequisites
        if: runner.os == 'macOS'
        run: brew install ta-lib

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -c requirements.lock -e ".[analysis,cli,test]"

      - name: Compile sources
        run: python -m compileall -q src interface main.py

      - name: Run tests with coverage
        run: python -m pytest --cov=src/momo --cov=interface --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ runner.os }}-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  build-and-security:
    name: Build, install, SBOM, and vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux TA-Lib prerequisites
        run: sudo apt-get update && sudo apt-get install -y libta-lib0 libta-lib-dev

      - name: Build package artifacts
        run: |
          python -m pip install --upgrade pip setuptools wheel build pip-audit cyclonedx-bom
          python -m build
          python -m pip install --no-deps dist/*.whl

      - name: Dependency vulnerability scan
        run: python -m pip_audit -r requirements.lock

      - name: Generate SBOM
        run: cyclonedx-py requirements -r requirements.lock -o momo-sbom.json

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: momo-release
          path: |
            dist/
            momo-sbom.json
